name: CI/CD Local Docker Pipeline

on:
  push:
    branches: [ "main" ] # Triggers automatically when you push to main

jobs:
  build-and-deploy:
    runs-on: self-hosted # Forces the job to execute on your local laptop runner

    steps:
      # ==========================================
      # 🛡️ STAGE 1: CONTINUOUS INTEGRATION (CI)
      # ==========================================
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Verify Code Integrity & Type Safety
        run: |
          npm ci
          npm run build

      # ==========================================
      # 🚀 STAGE 2: CONTINUOUS DEPLOYMENT (CD)
      # ==========================================
      - name: 4. Tear Down Stale Container
        run: |
          # Stops and removes the container if it exists, continues safely if it doesn't
          docker stop portfolio-app || true
          docker rm portfolio-app || true

      - name: 5. Compile Fresh Production Docker Image
        run: |
          docker build -t portfolio-prod:latest .

      - name: 6. Launch Container in Docker Desktop
        run: |
          docker run -d --name portfolio-app -p 3000:3000 --restart always portfolio-prod:latest

          