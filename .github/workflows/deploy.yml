name: CI/CD Local Docker Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Verify Code Integrity & Type Safety
        run: |
          npm ci
          npm run build

      - name: 4. Tear Down Stale Container
        run: |
          try {
              $ErrorActionPreference = "Stop"
              if (docker ps -a --format '{{.Names}}' | Select-String -Pattern "^portfolio-app$") {
                  docker stop portfolio-app
                  docker rm portfolio-app
              } else {
                  Write-Output "portfolio-app container does not exist. Safe to proceed."
              }
          } catch {
              Write-Output "Silently handling fallback: $_"
          }
          exit 0

      # NOTE: Added -f src/Dockerfile to point to the correct subfolder
      - name: 5. Compile Fresh Production Docker Image
        run: |
          docker build -f src/Dockerfile -t portfolio-prod:latest .

      - name: 6. Launch Container in Docker Desktop
        run: |
          docker run -d --name portfolio-app -p 3000:3000 --restart always portfolio-prod:latest
