name: CI/CD Local Docker Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Verify Code Integrity & Type Safety
        run: |
          npm ci
          npm run build
# NOTE: Changed 'docker' to '& "C:\Program Files\Docker\Docker\resources\bin\docker.exe"'
      - name: 4. Tear Down Stale Container
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          & "C:\Program Files\Docker\Docker\resources\bin\docker.exe" stop portfolio-app
          & "C:\Program Files\Docker\Docker\resources\bin\docker.exe" rm portfolio-app

      - name: 5. Compile Fresh Production Docker Image
        run: |
          & "C:\Program Files\Docker\Docker\resources\bin\docker.exe" build -t portfolio-prod:latest .

      - name: 6. Launch Container in Docker Desktop
        run: |
          & "C:\Program Files\Docker\Docker\resources\bin\docker.exe" run -d --name portfolio-app -p 3000:3000 --restart always portfolio-prod:latest